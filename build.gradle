import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
	// Non-remapping Loom. 26.x is deobfuscated, so there is no intermediary
	// step and no remapJar task — the plain `jar` is the publishable artifact.
	id 'net.fabricmc.fabric-loom' version '1.17.20'
	id 'com.modrinth.minotaur' version '2.9.0'
	id 'net.darkhax.curseforgegradle' version '1.1.28'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the official Mojang, Fabric, and Maven Central repositories for us.
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

dependencies {
	// No `mappings` line: Loom builds against Mojang names directly on 26.x.
	// Nothing needs remapping, so these are plain `implementation`, not
	// `modImplementation`.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Mod Menu provides the config screen entry; Cloth Config provides the widgets.
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	// Only JDK 21 is installed locally; the foojay resolver in settings.gradle
	// fetches 25 into Gradle's cache.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// Publishing to Modrinth. The token is read from the environment and never
// stored in the repo:
//   MODRINTH_TOKEN="$(cat ~/.config/mclabs-addons/modrinth-token)" \
//     ./gradlew modrinth -PchangelogFile=<same notes file as the GitHub release>
// Dependencies here mirror fabric.mod.json: Fabric API required, Mod Menu and
// Cloth Config optional.
modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = 'W09tZtbv' // mclabs-addons
	versionNumber = project.mod_version
	versionName = "v${project.mod_version}"
	versionType = 'release'
	uploadFile = tasks.jar // non-remapping Loom has no remapJar
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']
	// Reuses the GitHub release body so the two never drift apart.
	changelog = project.hasProperty('changelogFile') ? file(project.changelogFile).getText('UTF-8') : ''
	// -PmodrinthDebug validates the request without uploading anything.
	debugMode = project.hasProperty('modrinthDebug')
	dependencies {
		required.project 'fabric-api'
		optional.project 'modmenu'
		optional.project 'cloth-config'
	}
}

// Publishing to CurseForge. Mirrors the Modrinth block above — same jar, same
// changelog file, same dependency shape:
//   CURSEFORGE_TOKEN="$(cat ~/.config/mclabs-addons/curseforge-token)" \
//     ./gradlew curseforge -PchangelogFile=<same notes file as the GitHub release>
tasks.register('curseforge', TaskPublishCurseForge) {
	apiToken = System.getenv('CURSEFORGE_TOKEN')
	// -PcurseforgeDebug validates the request without uploading anything.
	debugMode = project.hasProperty('curseforgeDebug')

	def mainFile = upload(project.curseforge_project_id, tasks.jar)
	mainFile.displayName = "v${project.mod_version}"
	mainFile.releaseType = 'release'
	mainFile.addModLoader('Fabric')
	mainFile.addGameVersion(project.minecraft_version)
	mainFile.addJavaVersion('Java 21')
	mainFile.changelogType = 'markdown'
	mainFile.changelog = project.hasProperty('changelogFile') ? file(project.changelogFile).getText('UTF-8') : ''
	mainFile.addRequirement('fabric-api')
	mainFile.addOptional('modmenu', 'cloth-config')
}

// One command for both stores, so a release can't ship to only one of them.
tasks.register('publishRelease') {
	dependsOn 'modrinth', 'curseforge'
}
