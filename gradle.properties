# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties — pinned for Minecraft 26.2
# check these on https://fabricmc.net/develop
# 26.x ships deobfuscated, so there is no yarn_mappings line any more: Yarn
# stopped at 1.21.11 and Loom builds straight against Mojang names.
minecraft_version=26.2
# Loader to build against. NOT the floor the mod declares — fabric.mod.json
# pins that separately at >=0.17.3; bumping this does not raise it.
loader_version=0.19.5
fabric_version=0.159.0+26.2

# Mod Menu (config screen tie-in) + Cloth Config (config widgets).
# Both optional at runtime; declared under "recommends" in fabric.mod.json.
modmenu_version=20.0.1
cloth_config_version=26.2.155

# Mod Properties
mod_version=1.16.0
maven_group=dev.jade
archives_base_name=mclabs-addons

# CurseForge project ID — the numeric "Project ID" in the mod page sidebar.
# https://legacy.curseforge.com/minecraft/mc-mods/mclabs-addons
curseforge_project_id=1645917
